# Local defaults. On a server, set these as environment variables instead.
# Create the database first in MySQL:  CREATE DATABASE skillgap;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillgap}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=${PORT:8080}

# JWT: use a long random string (32+ characters) in production
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-123456}
app.jwt.expiry-hours=24

# Optional: enables AI bullet rewriting. Without a key, a rule-based fallback is used.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-5-5
